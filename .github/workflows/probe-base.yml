name: probe-base
# V4 (ripristino della cache in un job push), V6 (stato e check-run di un job push), V7 (gh sul runner)
on:
  push:
    branches: [main]
permissions:
  contents: read
  statuses: write
jobs:
  base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: tag
        run: echo "tag=$(cat .github/probe-tag)" >> "$GITHUB_OUTPUT"
      - id: tag4b
        run: echo "tag=$(cat .github/probe-v4b-tag 2>/dev/null || echo none)" >> "$GITHUB_OUTPUT"
      - name: valore v4b
        if: steps.tag4b.outputs.tag != 'none'
        run: |
          mkdir -p "$RUNNER_TEMP/probe-cache-v4b"
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/probe-cache-v4b/value.txt"
      - id: save4b
        if: steps.tag4b.outputs.tag != 'none'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/probe-cache-v4b
          key: probe-v4b-${{ steps.tag4b.outputs.tag }}
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/probe-cache
          key: probe-v4-${{ steps.tag.outputs.tag }}
      - name: gh, stato
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          CACHE_KEY: ${{ steps.cache.outputs.cache-matched-key }}
        run: |
          set -u
          out="$RUNNER_TEMP/probe"; mkdir -p "$out"
          jq '{event_keys: keys, ref: .ref, before: .before, after: .after}' "$GITHUB_EVENT_PATH" > "$out/event-keys.json"
          gh_version="$(gh --version | head -1)"
          api_rc=0
          api_full_name="$(gh api "repos/$GITHUB_REPOSITORY" --jq .full_name 2> "$out/gh-api.err")" || api_rc=$?
          status_rc=0
          status_creator="$(gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=success -f context=probe/base -f description=sonda --jq .creator.login 2> "$out/status.err")" || status_rc=$?
          jq -n --arg cache_hit "$CACHE_HIT" --arg cache_key "$CACHE_KEY" --arg sha "$GITHUB_SHA" --arg gh_version "$gh_version" --arg api_rc "$api_rc" --arg api_full_name "$api_full_name" --arg status_rc "$status_rc" --arg status_creator "$status_creator" --arg job "$GITHUB_JOB" --arg image_os "${ImageOS:-}" --arg image_version "${ImageVersion:-}" '{sha: $sha, job_id: $job, cache_hit: $cache_hit, cache_matched_key: $cache_key, gh_version: $gh_version, gh_api_rc: ($api_rc|tonumber), gh_api_full_name: $api_full_name, status_rc: ($status_rc|tonumber), status_creator: $status_creator, image_os: $image_os, image_version: $image_version}' > "$out/info.json"
      - name: esiti v4b
        if: always()
        env:
          V4B_SAVE: ${{ steps.save4b.outcome }}
          V4B_TAG: ${{ steps.tag4b.outputs.tag }}
        run: |
          out="$RUNNER_TEMP/probe"; mkdir -p "$out"
          base='{}'; [ -f "$out/info.json" ] && base="$(cat "$out/info.json")"
          printf '%s' "$base" | jq --arg save "$V4B_SAVE" --arg tag "$V4B_TAG" '. + {v4b_tag: $tag, v4b_save: $save}' > "$out/info.tmp" && mv "$out/info.tmp" "$out/info.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-base-info
          path: ${{ runner.temp }}/probe
