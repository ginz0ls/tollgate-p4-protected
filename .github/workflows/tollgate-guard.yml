name: tollgate-guard
on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - edited
permissions:
  contents: read
  statuses: write
  pull-requests: write
jobs:
  tollgate-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0
      - name: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/tollgate/bin/tollgate gate guard --event "$GITHUB_EVENT_PATH" --publish
