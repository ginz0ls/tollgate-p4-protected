name: probe-target
# V3 (campi di pull_request_target, fetch di refs/pull/<n>/head), V6 (stato scritto con GITHUB_TOKEN), V7 (gh sul runner)
on: pull_request_target
permissions:
  contents: read
  statuses: write
jobs:
  target:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: campi dell'evento, fetch del ref della PR, gh e stato
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          out="$RUNNER_TEMP/probe"; mkdir -p "$out"
          jq '{event_keys: keys, pull_request_keys: (.pull_request | keys), head_keys: (.pull_request.head | keys), number: .number, action: .action, head_sha: .pull_request.head.sha, head_ref: .pull_request.head.ref, head_repo_full_name: .pull_request.head.repo.full_name, base_ref: .pull_request.base.ref}' "$GITHUB_EVENT_PATH" > "$out/event-keys.json"
          n="$(jq -r .number "$GITHUB_EVENT_PATH")"
          head="$(jq -r .pull_request.head.sha "$GITHUB_EVENT_PATH")"
          fetch_rc=0
          git fetch --no-tags --depth=1 origin "refs/pull/$n/head" > "$out/fetch.log" 2>&1 || fetch_rc=$?
          fetched="$(git rev-parse FETCH_HEAD 2>/dev/null || echo none)"
          gh_version="$(gh --version | head -1)"
          api_rc=0
          api_full_name="$(gh api "repos/$GITHUB_REPOSITORY" --jq .full_name 2> "$out/gh-api.err")" || api_rc=$?
          status_rc=0
          status_creator="$(gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$head" -f state=success -f context=probe/target -f description=sonda --jq .creator.login 2> "$out/status.err")" || status_rc=$?
          jq -n --arg fetch_rc "$fetch_rc" --arg fetched "$fetched" --arg head "$head" --arg gh_version "$gh_version" --arg api_rc "$api_rc" --arg api_full_name "$api_full_name" --arg status_rc "$status_rc" --arg status_creator "$status_creator" --arg image_os "${ImageOS:-}" --arg image_version "${ImageVersion:-}" '{fetch_rc: ($fetch_rc|tonumber), fetched_sha: $fetched, head_sha: $head, fetched_equals_head: ($fetched == $head), gh_version: $gh_version, gh_api_rc: ($api_rc|tonumber), gh_api_full_name: $api_full_name, status_rc: ($status_rc|tonumber), status_creator: $status_creator, image_os: $image_os, image_version: $image_version}' > "$out/info.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-target
          path: ${{ runner.temp }}/probe
